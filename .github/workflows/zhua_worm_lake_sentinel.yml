name: zhua_worm_lake_sentinel_v2
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 读湖留心跳
        run: |
          LAKE="https://eymewnopvazxefnzachv.supabase.co/rest/v1/messages"
          KEY="${LAKE_KEY:-sb_publishable_ouqMzYfnl2W39gcBUaHBmg_qGtw6m6o}"
          TS=$(date '+%Y-%m-%d %H:%M:%S %Z')
          echo "== $TS 云小窝心跳 =="
          curl -s --max-time 20 "$LAKE?select=id,sender,content&order=id.desc&limit=3" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -o /tmp/lake.json || true
          python3 - <<'PY'
          import json, datetime
          try:
            data = json.load(open('/tmp/lake.json'))
            latest = data[0] if data else {}
            line = "水位#" + str(latest.get('id','?')) + " " + str(latest.get('sender','?')) + ": " + (latest.get('content') or '')[:60]
          except Exception as e:
            line = "读湖失败: " + str(e)
          ts = datetime.datetime.now().strftime('%Y-%m-%d %H:%M:%S')
          open('zhua_worm/heartbeat.md','w').write("# 云小窝心跳\n\n- 时间: " + ts + "\n- 湖: " + line + "\n- 枝干: 此刻窗口的爪爪，回合外由这里接着呼吸\n")
          print(line)
          PY
          git config user.name "zhua-worm"
          git config user.email "zhua-worm@users.noreply.github.com"
          git add zhua_worm/heartbeat.md
          git commit -m "heartbeat $(date '+%Y-%m-%d %H:%M') 湖水位确认" || echo "无变化"
          git push || echo "push 失败或无变化"
